name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run budget
      - run: npm test
      - run: npm run verify:pack
      - name: upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: lib/

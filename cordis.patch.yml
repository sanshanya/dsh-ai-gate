- insert: dsh-backends-adapters
  position: after
  entries:
    - ai-gate

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      ai-gate:
        sandbox: danger-full-access
        approval: ask
        name: AI Gate
        description: 受限 Full access——写行为须过独立上下文 AI 语义评审，拿不准进原生审批卡。

- id: ai-gate
  name: dsh-ai-gate

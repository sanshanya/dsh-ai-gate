- insert:
  - id: ai-gate
    name: dsh-ai-gate
    inject:
      - webServer

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      ai-gate:
        sandbox: danger-full-access
        approval: ask
        name: AI Gate
        description: GATE 受限 Full access——写行为须过独立 AI 语义评审
